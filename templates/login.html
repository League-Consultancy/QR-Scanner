<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In // LUXE-TRACE Optical Engine</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="login-page-body">
  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Brand Header -->
      <div class="login-header">
        <div class="login-brand-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 3h12l4 6-10 12L2 9l4-6z"/>
            <path d="M11 3L8 9l4 12 4-12-3-6"/>
            <path d="M2 9h20"/>
          </svg>
        </div>
        <h1 class="login-title">LUXE-TRACE</h1>
        <p class="login-subtitle">Optical Inventory & Picking Engine</p>
      </div>

      <!-- Success / Error Notification Banners -->
      {% if success %}
      <div class="login-alert success" role="alert">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span>{{ success }}</span>
      </div>
      {% endif %}

      {% if error %}
      <div class="login-alert" role="alert">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Login Form -->
      <form class="login-form" method="POST" action="/login{% if next_url %}?next={{ next_url }}{% endif %}">
        <div class="login-field-group">
          <label class="login-label" for="username">Username</label>
          <div class="login-input-wrap">
            <span class="login-input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="login-input" 
              placeholder="Enter your username..."
              required 
              autofocus 
              autocomplete="username"
              value="{{ username or '' }}"
            />
          </div>
        </div>

        <div class="login-field-group">
          <label class="login-label" for="password">Password</label>
          <div class="login-input-wrap">
            <span class="login-input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="login-input" 
              placeholder="••••••••••••"
              required 
              autocomplete="current-password"
            />
            <button type="button" class="toggle-password-btn" id="toggle-password-btn" title="Show/Hide password">
              <svg id="eye-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-submit-btn">
          <span>Sign In</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

        <div class="login-switch-view">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="opacity: 0.7; flex-shrink: 0;">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span>Need access? Ask an administrator to create your account.</span>
        </div>
      </form>

      <!-- Security Footer -->
      <div class="login-footer">
        <span class="login-footer-badge">●</span>
        <span>Secure Local Vision System &bull; Auth Guard</span>
      </div>

    </div>
  </div>

  <script>
    // Show / Hide Password toggle
    const toggleBtn = document.getElementById('toggle-password-btn');
    const pwdInput = document.getElementById('password');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword 
          ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
          : '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      });
    }
  </script>
</body>
</html>
