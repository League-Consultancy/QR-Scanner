<!-- 1. TOP HEADER -->
<header class="app-header">
  <div class="header-brand">
    <div class="brand-symbol">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 3h12l4 6-10 12L2 9l4-6z"/>
        <path d="M11 3L8 9l4 12 4-12-3-6"/>
        <path d="M2 9h20"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1 class="brand-title">LUXE-TRACE</h1>
      <span class="brand-tagline">Optical Inventory & Picking Engine</span>
    </div>
  </div>

  <div class="header-badges">
    <div class="status-pill status-live" title="Camera stream state">
      <span class="pulse-dot"></span>
      <span class="pill-label">CAMERA: <strong id="header-cam-status">ACTIVE (30 FPS)</strong></span>
    </div>
    <div class="status-pill status-calibrated" title="Projector homography status">
      <span class="status-icon">⌖</span>
      <span class="pill-label">CALIBRATION: <strong id="header-calib-status">ALIGNED</strong></span>
    </div>
    <div class="status-pill status-inventory" id="header-inv-pill" title="DiamDash CRM Store Inventory (On Hand)">
      <span class="status-icon">❖</span>
      <span class="pill-label">INVENTORY: <strong id="header-inv-count">SYNCED (225 ON HAND)</strong></span>
      <button class="pill-sync-btn" id="btn-header-sync" title="Sync now from DiamDash CRM">↻</button>
    </div>
    <div class="status-pill status-user" title="Active authenticated session">
      <span class="status-icon">👤</span>
      <span class="pill-label"><strong id="header-user-name">{{ (session.get('user') or {}).get('username', 'Admin') | upper }}</strong> <span class="header-role-tag">({{ (session.get('user') or {}).get('role', 'operator') | upper }})</span></span>
      <button class="pill-settings-btn" id="btn-open-settings" title="Settings & User Management">⚙ Settings</button>
      <a href="/logout" class="pill-logout-link" title="Sign Out of LUXE-TRACE">⎋ Sign Out</a>
    </div>
  </div>
</header>
